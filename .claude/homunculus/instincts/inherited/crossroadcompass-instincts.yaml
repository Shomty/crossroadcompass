# Crossroadcompass Workflow Add Or Evolve Database Table Or Model

## Action

Follow the add-or-evolve-database-table-or-model workflow:
1. Edit prisma/schema.prisma to add or change a model/table.
2. Generate or write a new migration SQL file under prisma/migrations/...
3. Update backend API route(s) or service logic to use the new/changed model.
4. Update types/index.ts or related type files if needed.
5. Sometimes update lib/kv/keys.ts or caching logic.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: prisma/schema.prisma, prisma/migrations/*/migration.sql, app/api/**/*.ts

